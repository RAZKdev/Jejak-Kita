<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none">
  <!-- Latitude & Longitude Subtle Grid -->
  <line x1="0" y1="80" x2="160" y2="80" stroke="currentColor" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.35"/>
  <line x1="80" y1="0" x2="80" y2="160" stroke="currentColor" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.35"/>
  
  <!-- Grid intersections markers (+) -->
  <path d="M 76 80 L 84 80 M 80 76 L 80 84" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <path d="M -4 0 L 4 0 M 0 -4 L 0 4" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <path d="M 156 160 L 164 160 M 160 156 L 160 164" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  
  <!-- Subtle Topographic Contour Curves -->
  <path d="M -10 110 C 30 115, 50 140, 90 135 C 130 130, 140 100, 170 95" stroke="currentColor" stroke-width="0.8" fill="none" opacity="0.3"/>
  <path d="M -10 130 C 25 135, 45 155, 85 150 C 125 145, 145 125, 170 120" stroke="currentColor" stroke-width="0.6" stroke-dasharray="2 2" fill="none" opacity="0.25"/>
  <path d="M 20 -10 C 35 25, 60 40, 100 35 C 135 30, 150 -10, 170 -10" stroke="currentColor" stroke-width="0.7" fill="none" opacity="0.28"/>
  <path d="M 0 35 C 20 50, 45 65, 85 55 C 120 45, 140 20, 170 15" stroke="currentColor" stroke-width="0.5" fill="none" opacity="0.2"/>

  <!-- Travel Waypoint Ring -->
  <circle cx="80" cy="80" r="14" stroke="currentColor" stroke-width="0.75" stroke-dasharray="2 2" fill="none" opacity="0.35"/>
  <circle cx="80" cy="80" r="2.5" fill="currentColor" opacity="0.5"/>
</svg>

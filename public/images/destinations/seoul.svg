<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="skySeoul" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A506B"/>
      <stop offset="45%" stop-color="#5C7A99"/>
      <stop offset="75%" stop-color="#F2C57C"/>
      <stop offset="100%" stop-color="#F38D68"/>
    </linearGradient>
    <linearGradient id="namsanHills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B3A42"/>
      <stop offset="100%" stop-color="#192226"/>
    </linearGradient>
    <linearGradient id="hanokRoof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D3136"/>
      <stop offset="50%" stop-color="#3E444A"/>
      <stop offset="100%" stop-color="#25282C"/>
    </linearGradient>
    <radialGradient id="twilightSun" cx="50%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#FFF0D4" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#F7A072" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F38D68" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Twilight Sky over Seoul -->
  <rect width="1200" height="630" fill="url(#skySeoul)"/>
  <circle cx="600" cy="380" r="280" fill="url(#twilightSun)"/>

  <!-- Distant Mountains (Bukhansan & Inwangsan) -->
  <path d="M 0 380 Q 180 270 340 330 Q 480 370 650 300 Q 820 250 980 320 Q 1100 290 1200 350 L 1200 630 L 0 630 Z" fill="#202C33" opacity="0.6"/>
  <path d="M 0 410 Q 220 330 460 380 Q 700 320 900 370 Q 1060 340 1200 390 L 1200 630 L 0 630 Z" fill="#1C272E" opacity="0.85"/>

  <!-- Namsan Mountain Ridge with N Seoul Tower -->
  <path d="M 680 460 Q 820 290 940 360 Q 1060 410 1200 450 L 1200 630 L 680 630 Z" fill="url(#namsanHills)"/>
  
  <!-- N Seoul Tower (Landmark on the hill, no people) -->
  <g transform="translate(870, 170)">
    <!-- Tower Mast -->
    <line x1="20" y1="0" x2="20" y2="130" stroke="#E2E8F0" stroke-width="3"/>
    <circle cx="20" cy="0" r="3" fill="#EF4444"/>
    <!-- Upper Observation Deck -->
    <rect x="8" y="45" width="24" height="14" rx="4" fill="#0F172A" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="11" y="48" width="18" height="8" rx="2" fill="#38BDF8"/>
    <!-- Tower Body Pillar -->
    <path d="M 16 60 L 14 130 L 26 130 L 24 60 Z" fill="#CBD5E1"/>
    <!-- Base Building -->
    <rect x="2" y="125" width="36" height="20" rx="3" fill="#1E293B"/>
    <!-- Broadcast light glow -->
    <circle cx="20" cy="52" r="16" fill="#38BDF8" opacity="0.25"/>
  </g>

  <!-- Modern Seoul City Skyline Silhouettes (High Rises & Office Towers) -->
  <g fill="#161F26" opacity="0.95">
    <rect x="60" y="380" width="55" height="180"/>
    <rect x="130" y="340" width="70" height="220"/>
    <rect x="215" y="360" width="50" height="200"/>
    <rect x="280" y="320" width="85" height="240"/>
    <rect x="380" y="350" width="60" height="210"/>
    <rect x="455" y="300" width="75" height="260"/>
    <rect x="545" y="340" width="90" height="220"/>
    <rect x="650" y="370" width="55" height="190"/>
    <!-- City lights in skyscrapers -->
    <g fill="#FDE047" opacity="0.75">
      <rect x="145" y="360" width="4" height="6"/><rect x="160" y="360" width="4" height="6"/><rect x="175" y="360" width="4" height="6"/>
      <rect x="145" y="380" width="4" height="6"/><rect x="160" y="380" width="4" height="6"/><rect x="175" y="380" width="4" height="6"/>
      <rect x="300" y="340" width="5" height="7"/><rect x="320" y="340" width="5" height="7"/><rect x="340" y="340" width="5" height="7"/>
      <rect x="300" y="365" width="5" height="7"/><rect x="320" y="365" width="5" height="7"/><rect x="340" y="365" width="5" height="7"/>
      <rect x="475" y="320" width="5" height="7"/><rect x="500" y="320" width="5" height="7"/>
      <rect x="475" y="345" width="5" height="7"/><rect x="500" y="345" width="5" height="7"/>
    </g>
  </g>

  <!-- Foreground: Traditional Korean Hanok / Gyeongbokgung Palace Architecture (Clean, Pure Architecture, NO People) -->
  <g transform="translate(180, 390)">
    <!-- Palace Platform / Stone Base -->
    <rect x="-80" y="150" width="940" height="90" fill="#2E3339"/>
    <rect x="-60" y="160" width="900" height="15" fill="#3D444C"/>
    
    <!-- Stone Balustrade (Woldae) -->
    <g fill="#4A525C">
      <rect x="-40" y="138" width="12" height="22"/>
      <rect x="80" y="138" width="12" height="22"/>
      <rect x="200" y="138" width="12" height="22"/>
      <rect x="320" y="138" width="12" height="22"/>
      <rect x="440" y="138" width="12" height="22"/>
      <rect x="560" y="138" width="12" height="22"/>
      <rect x="680" y="138" width="12" height="22"/>
      <rect x="800" y="138" width="12" height="22"/>
      <rect x="-50" y="134" width="870" height="6" rx="2"/>
    </g>

    <!-- Traditional Wooden Columns (Dancheong Red & Brown) -->
    <rect x="40" y="55" width="22" height="95" rx="3" fill="#8C3A27"/>
    <rect x="180" y="55" width="22" height="95" rx="3" fill="#8C3A27"/>
    <rect x="320" y="55" width="22" height="95" rx="3" fill="#8C3A27"/>
    <rect x="460" y="55" width="22" height="95" rx="3" fill="#8C3A27"/>
    <rect x="600" y="55" width="22" height="95" rx="3" fill="#8C3A27"/>
    <rect x="740" y="55" width="22" height="95" rx="3" fill="#8C3A27"/>

    <!-- Traditional Korean Curved Eaves Roof (Giwa Tile Roof with Cheoma Curve) -->
    <!-- Lower Roof Tier -->
    <path d="M -30 65 Q 400 35 830 65 Q 860 62 840 50 Q 400 10 -40 50 Q -60 62 -30 65 Z" fill="url(#hanokRoof)"/>
    <path d="M -40 50 Q 400 12 840 50 L 830 40 Q 400 5 -30 40 Z" fill="#525B64"/>

    <!-- Upper Roof Tier (Gabled Palace Pavilion) -->
    <rect x="160" y="-10" width="480" height="45" fill="#752F1E"/>
    <path d="M 60 0 Q 400 -40 740 0 Q 770 -5 750 -15 Q 400 -65 50 -15 Q 30 -5 60 0 Z" fill="url(#hanokRoof)"/>
    <path d="M 50 -15 Q 400 -65 750 -15 L 740 -22 Q 400 -72 60 -22 Z" fill="#525B64"/>
    
    <!-- Roof Dragon Ridge (Yongmaru) -->
    <path d="M 120 -28 Q 400 -42 680 -28 L 685 -34 Q 400 -48 115 -34 Z" fill="#E2E8F0"/>
    <circle cx="115" cy="-34" r="5" fill="#E2E8F0"/>
    <circle cx="685" cy="-34" r="5" fill="#E2E8F0"/>
  </g>

  <!-- Title / Location Plaque in Image -->
  <g transform="translate(48, 48)">
    <rect width="320" height="46" rx="8" fill="#171816" opacity="0.85" stroke="#363B34" stroke-width="1.5"/>
    <text x="18" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#F4F6F4">Kota Seoul • Namsan &amp; Istana Kerajaan</text>
  </g>
</svg>

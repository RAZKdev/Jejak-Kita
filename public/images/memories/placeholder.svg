<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F4EE"/>
      <stop offset="100%" stop-color="#EBE5DA"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="402" rx="16" fill="#FBF9F5" stroke="#DFD7CB" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Camera & Landscape Icon Container -->
  <g transform="translate(350, 130)">
    <circle cx="50" cy="50" r="50" fill="#E8F0EB"/>
    <!-- Camera Body -->
    <rect x="22" y="32" width="56" height="42" rx="7" fill="#1C3B2B"/>
    <!-- Camera Top Notch -->
    <path d="M 38 32 L 44 24 L 56 24 L 62 32 Z" fill="#1C3B2B"/>
    <!-- Camera Lens -->
    <circle cx="50" cy="53" r="14" fill="#FFFFFF"/>
    <circle cx="50" cy="53" r="10" fill="#2E5C44"/>
    <!-- Camera Flash -->
    <circle cx="68" cy="38" r="3" fill="#DDA032"/>
  </g>

  <text x="400" y="275" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#242220">Foto Kenangan Perjalanan</text>
  <text x="400" y="305" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#6B655F">Potret momen kebersamaan dan cerita berharga</text>
</svg>
